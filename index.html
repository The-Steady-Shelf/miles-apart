:root[data-theme="snow"]{
  --bg:#FBF8F4;--bg2:#F1ECE4;--card:#ffffff;--card2:#F6F1E8;--ink:#1F2A44;--muted:#5c6785;--accent:#B5781C;--accent-ink:#ffffff;
  --line:rgba(31,42,68,.16);--lit1:#FCE3A6;--lit2:#EDB75E;--dark:#DCD6CB;--dark-ink:#8f8a80;--paper:#FFF7EA;--paper-ink:#2b2433;--shadow:0 8px 24px rgba(31,42,68,.14);
}
:root[data-theme="rose"]{
  --bg:#F6E3DE;--bg2:#EDCFC8;--card:#FFF6F3;--card2:#F9E9E4;--ink:#4A1830;--muted:#7a4a5c;--accent:#8A2547;--accent-ink:#ffffff;
  --line:rgba(74,24,48,.18);--lit1:#FFD9C7;--lit2:#E58EA2;--dark:#E2BDB7;--dark-ink:#9a6c78;--paper:#FFF6F0;--paper-ink:#3b1b2b;--shadow:0 8px 24px rgba(74,24,48,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;min-height:100vh;min-height:100dvh}
:root:not([data-theme="snow"]):not([data-theme="rose"]):not([data-theme="xmas"]) body{background:radial-gradient(1200px 700px at 50% -10%,#2b3a63 0,#1a2440 45%,#111829 100%) fixed}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.15;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px 60px;position:relative;z-index:1}
.wrap.wide{max-width:760px}
.hidden{display:none!important}
.small{font-size:13px;color:var(--muted)}
.tiny{font-size:11.5px;color:var(--muted)}
.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 22px;font-weight:600;font-size:15.5px;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none;min-height:46px;transition:transform .12s ease,opacity .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:13.5px;min-height:36px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.stack>*+*{margin-top:14px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap-row{flex-wrap:wrap}
.grow{flex:1;min-width:0}
label.lab{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:var(--ink)}
input[type=text],input[type=url],input[type=date],select,textarea{width:100%;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:16px;color:var(--ink)}
textarea{resize:vertical;min-height:84px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.count{font-size:12px;color:var(--muted);text-align:right;margin-top:3px}
.count.warn{color:var(--bad)}
.err{color:var(--bad);font-size:13.5px;margin-top:6px}
.errbox{border:1.5px solid var(--bad);background:rgba(241,161,161,.10);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14.5px}
.errbox b{display:block;margin-bottom:6px;color:var(--ink)}
.errbox ul{margin:0;padding-left:18px}.errbox li{margin:4px 0}
.errlink{background:none;border:0;padding:0;color:var(--bad);font:inherit;text-align:left;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.needs{border-color:var(--bad)!important;box-shadow:0 0 0 3px rgba(241,161,161,.35)!important}
.ok{color:var(--good)}
/* header / brand */
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand .mark{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.01em}
.brand .mark span{color:var(--accent)}
.hero h1{font-size:34px;margin:6px 0 8px}
.hero p{color:var(--muted);margin:0}
/* mode picker */
.modes{display:grid;gap:10px}
.mode{display:block;text-align:left;border:1.5px solid var(--line);background:var(--card2);border-radius:14px;padding:13px 14px;cursor:pointer;width:100%;color:var(--ink)}
.mode b{display:block;font-size:15.5px}
.mode span{font-size:13px;color:var(--muted)}
.mode.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
/* zone picker */
.zp{position:relative}
.zp input{scroll-margin-top:84px}
.zp-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;z-index:30;max-height:300px;overflow:auto;box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
.zp-list button{display:flex;width:100%;justify-content:space-between;gap:8px;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 12px;cursor:pointer;color:var(--ink)}
.zp-list button:last-child{border-bottom:0}
.zp-list small{color:var(--muted);white-space:nowrap;align-self:center}
.zp-list button{min-height:48px;align-items:center;font-size:15px}
.zp-list button.act,.zp-list button:hover{background:var(--card2)}
.zp-sub{color:var(--muted);font-size:13.5px}
.zp-tag{margin-left:8px;font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.zp-now{font-size:12.5px;color:var(--muted);margin-top:5px;min-height:1em}
/* door editor */
.week-h{margin:22px 0 8px}
.week-h h3{font-size:19px}
.door-ed{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.door-ed .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.door-ed .num{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--accent);min-width:32px}
.door-ed select{width:auto;padding:7px 10px;font-size:14px}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--accent);color:var(--accent-ink)}
.badge.soft{background:transparent;border:1px solid var(--line);color:var(--muted)}
.sticky-count{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:6px}
.pbar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chipb{flex:1;border:1.5px solid var(--line);background:var(--card2);border-radius:12px;padding:10px;text-align:center;cursor:pointer;font-size:14px;color:var(--ink)}
.chipb.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.chipb i{display:block;height:22px;border-radius:7px;margin-bottom:6px;border:1px solid rgba(0,0,0,.15)}
/* result */
.linkbox{display:block;background:var(--card2);border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;word-break:break-all;max-height:90px;overflow:auto;color:var(--gold,#E8B45A);text-decoration:underline;text-underline-offset:2px}
/* calendar */
.cal-head{text-align:center;padding:10px 0 4px}
.cal-head .from{font-size:13px;color:var(--muted)}
.cal-head h1{font-size:30px;margin:4px 0 6px}
.callwin{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13.5px;text-align:left;margin:12px 0}
.callwin b{color:var(--accent)}
.building{background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.28));border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
:root[data-theme="snow"] .building,:root[data-theme="rose"] .building{background:linear-gradient(180deg,rgba(31,42,68,.06),rgba(31,42,68,.12))}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.win{position:relative;aspect-ratio:3/4;border-radius:999px 999px 8px 8px/46px 46px 8px 8px;border:2px solid rgba(255,255,255,.12);background:var(--dark);color:var(--dark-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--serif);cursor:pointer;padding:0;transition:transform .15s}
:root[data-theme="snow"] .win,:root[data-theme="rose"] .win{border-color:rgba(31,42,68,.22)}
.win .n{font-size:22px;font-weight:600;margin-top:10px}
.win .s{font-family:var(--sans);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;margin-top:2px;opacity:.9;text-align:center;line-height:1.15;padding:0 4px}
.win.locked{cursor:default}
.win.opened{background:linear-gradient(180deg,var(--lit1),var(--lit2));color:#3a2a10;border-color:rgba(255,255,255,.35);box-shadow:0 0 14px rgba(232,180,90,.35)}
.win.today{background:linear-gradient(180deg,var(--lit1),var(--lit2));color:#3a2a10;border-color:#fff;animation:pulse 2.2s ease-in-out infinite}
.win.catch{background:linear-gradient(180deg,#d7b57a,#b98d4b);color:#3a2a10;border-color:rgba(255,255,255,.3)}
.win:not(.locked):active{transform:scale(.96)}
.win .tag{position:absolute;top:-7px;right:-4px;background:#fff;color:#7a3b00;border-radius:99px;padding:1px 6px;font:700 9px var(--sans);letter-spacing:.04em;text-transform:uppercase;box-shadow:0 2px 6px rgba(0,0,0,.3)}
@keyframes pulse{0%,100%{box-shadow:0 0 10px 2px rgba(232,180,90,.55)}50%{box-shadow:0 0 26px 8px rgba(255,214,128,.85)}}
.progress{margin:14px 0 4px;text-align:center}
.progress .pbar{margin-top:6px}
/* door sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
:root:not([data-theme="snow"]):not([data-theme="rose"]):not([data-theme="xmas"]) .sheet{background:radial-gradient(1000px 600px at 50% -10%,#2b3a63 0,#1a2440 50%,#111829 100%)}
.sheet .wrap{padding-top:14px}
.doorhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{background:var(--card);border:1px solid var(--line);border-radius:99px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex:0 0 auto}
.doorhead .big{font-family:var(--serif);font-size:44px;font-weight:600;color:var(--accent);line-height:1}
.doorhead .kind{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.doorhead .wk{font-size:13px;color:var(--muted)}
.qtext{font-family:var(--serif);font-size:23px;line-height:1.3;margin:6px 0 16px}
.extra{background:var(--card);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:15px}
.notecard{background:var(--paper);color:var(--paper-ink);border-radius:16px;padding:22px 20px;box-shadow:0 12px 30px rgba(0,0,0,.28);font-family:var(--serif);font-size:19px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;position:relative}
.notecard.hint{font-style:italic;font-size:17px}
.notecard .sig{display:block;margin-top:14px;font-size:15px;font-style:italic;color:#6b5b73}
.ticket{background:var(--pine);color:#f4efe2;border-radius:16px;padding:20px;position:relative;border:2px dashed rgba(244,239,226,.6);text-align:center}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}
.ticket::before{left:-13px}.ticket::after{right:-13px}
.ticket .t1{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:#e6c98a}
.ticket .t2{font-family:var(--serif);font-size:22px;margin:8px 0 4px}
.answerbox{margin:6px 0 12px}
.reveal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.reveal .who{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent);margin-bottom:6px}
.reveal .txt{font-family:var(--serif);font-size:18px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.reveal.mine .who{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.callline{margin-top:20px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.callline b{color:var(--accent)}
.plan-in{display:grid;gap:10px}
.songbox{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.songbox .disc{flex:0 0 52px;height:52px;border-radius:50%;background:conic-gradient(var(--accent),#7a5a1f,var(--accent));display:flex;align-items:center;justify-content:center;color:var(--accent-ink)}
/* keepsake */
.keep{background:var(--paper);color:var(--paper-ink);border-radius:20px;padding:22px 18px;box-shadow:var(--shadow)}
.keep h1{font-size:30px;text-align:center;color:#2c2540}
.keep .sub{text-align:center;color:#6b5b73;font-size:13.5px;margin:6px 0 18px}
.keep .qb{border-top:1px solid rgba(43,36,51,.18);padding:14px 0}
.keep .qb .q{font-family:var(--serif);font-style:italic;font-size:16.5px;margin-bottom:8px;color:#2c2540}
.keep .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.keep .col{background:rgba(255,255,255,.6);border-radius:10px;padding:9px 10px}
.keep .col .who{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#8a5a1a;margin-bottom:3px}
.keep .col .t{font-size:14.5px;white-space:pre-wrap;word-wrap:break-word;line-height:1.45}
.keep .letter{background:#fff;border-radius:12px;padding:14px;margin-top:6px;font-family:var(--serif);font-size:16.5px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.keep .tiny{color:#6b5b73}
/* misc */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:11px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.35);max-width:90vw;text-align:center}
.banner{background:var(--accent);color:var(--accent-ink);text-align:center;font-size:13.5px;font-weight:600;padding:8px 12px;position:sticky;top:0;z-index:60}
.banner button{margin-left:10px}
.tip{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:flex-start;margin-top:14px}
.tip button{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;max-height:70vh;overflow:auto;padding:16px;box-shadow:0 -10px 30px rgba(0,0,0,.4)}
.drawer .opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;color:var(--ink);font-size:14.5px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70}
.reveal-screen{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.reveal-screen h1{font-size:34px}
.reveal-screen .door-ill{width:120px;height:160px;border-radius:60px 60px 10px 10px/70px 70px 10px 10px;background:linear-gradient(180deg,var(--lit1),var(--lit2));margin-bottom:22px;box-shadow:0 0 40px 10px rgba(232,180,90,.45);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:48px;color:#3a2a10}
.foot{text-align:center;margin-top:30px;font-size:12px;color:var(--muted)}
.foot span{font-family:var(--serif);font-weight:600}
.snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.snow i{position:absolute;top:-12px;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.75);animation:fall linear infinite}
:root[data-theme="snow"] .snow i{background:rgba(31,42,68,.18)}
:root[data-theme="rose"] .snow i{background:rgba(138,37,71,.2)}
@keyframes fall{to{transform:translateY(110vh) translateX(30px)}}

/* ===== CHRISTMAS THEME ===== */
:root[data-theme="xmas"]{
  --bg:#0C271D;--bg2:#12362A;--card:#14392B;--card2:#1B4838;--ink:#FFF8EC;--muted:#BCD6C4;--accent:#F2C14E;--accent-ink:#45100F;
  --line:rgba(255,248,236,.2);--lit1:#FFE7A3;--lit2:#F2B33D;--dark:#7C1620;--dark-ink:#FFE3C6;--paper:#FFF8EC;--paper-ink:#2b1a1a;
  --good:#9be0b0;--bad:#ffb0a8;--red:#C42B35;--red2:#8f1d27;--green:#1f6a4a;--shadow:0 10px 30px rgba(0,0,0,.4);
}
:root[data-theme="xmas"] body{background:radial-gradient(1100px 700px at 50% -10%,#1d5a43 0,#103a2b 45%,#0a2118 100%) fixed;padding-top:30px}
:root[data-theme="xmas"] .sheet{background:radial-gradient(1000px 600px at 50% -10%,#1d5a43 0,#103a2b 50%,#0a2118 100%)}
:root[data-theme="xmas"] .sheet .wrap{padding-top:46px}
:root[data-theme="xmas"] .wrap{padding-top:34px}
:root[data-theme="xmas"] h1,:root[data-theme="xmas"] h2{text-shadow:0 2px 12px rgba(0,0,0,.35)}
:root[data-theme="xmas"] .btn.ghost{border-color:rgba(242,193,78,.6)}
:root[data-theme="xmas"] .mode.on,:root[data-theme="xmas"] .chipb.on{border-color:var(--accent)}
:root[data-theme="xmas"] .card,:root[data-theme="xmas"] .door-ed{border-color:rgba(242,193,78,.28)}
:root[data-theme="xmas"] .door-ed .num{color:#fff;background:radial-gradient(circle at 35% 30%,#ff6a6f,var(--red) 55%,var(--red2));width:38px;height:38px;min-width:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:inset 0 -3px 6px rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.35)}
/* garland */
.garland{position:fixed;left:0;right:0;top:0;height:58px;z-index:55;pointer-events:none;overflow:hidden}
.garland svg{position:absolute;left:0;top:0;width:100%;height:30px}
.garland i{position:absolute;width:14px;height:20px;border-radius:50% 50% 55% 55%/38% 38% 62% 62%;transform:translateX(-50%);animation:twinkle 1.8s ease-in-out infinite;box-shadow:0 0 12px 3px currentColor}
.garland i::before{content:"";position:absolute;left:50%;top:-5px;width:6px;height:6px;background:#2b2b2b;transform:translateX(-50%);border-radius:1px}
@keyframes twinkle{0%,100%{opacity:1;filter:brightness(1.15)}50%{opacity:.55;filter:brightness(.7)}}
/* gift doors */
:root[data-theme="xmas"] .building{border:5px solid transparent;border-radius:24px;background:linear-gradient(rgba(8,30,22,.82),rgba(8,30,22,.82)) padding-box,repeating-linear-gradient(135deg,#C42B35 0 12px,#FFF8EC 12px 24px) border-box;padding:14px}
:root[data-theme="xmas"] .win{overflow:visible;border:2px solid rgba(255,255,255,.28);color:#FFF1DC;z-index:0}
:root[data-theme="xmas"] .win.locked{background:linear-gradient(180deg,#d13b45,#8f1d27)}
:root[data-theme="xmas"] .win.locked:nth-child(3n+2){background:linear-gradient(180deg,#2c8a63,#175339)}
:root[data-theme="xmas"] .win.locked:nth-child(3n){background:linear-gradient(180deg,#fff8ec,#e6d9c2);color:#7C1620}
:root[data-theme="xmas"] .win.locked::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:11px;transform:translateX(-50%);background:linear-gradient(90deg,#c99a2e,#ffe08a 50%,#c99a2e);z-index:0;border-radius:3px}
:root[data-theme="xmas"] .win.locked::after{content:"";position:absolute;left:50%;top:-8px;width:26px;height:14px;transform:translateX(-50%);background:radial-gradient(circle at 25% 55%,#ffe08a 0 6px,transparent 7px),radial-gradient(circle at 75% 55%,#ffe08a 0 6px,transparent 7px),radial-gradient(circle at 50% 60%,#c99a2e 0 3px,transparent 4px)}
:root[data-theme="xmas"] .win.locked .n{position:relative;z-index:1;background:inherit;border-radius:8px;padding:0 6px;text-shadow:none;margin-top:6px}
:root[data-theme="xmas"] .win.locked .s{position:relative;z-index:1;background:rgba(20,10,10,.55);color:#FFF1DC;border-radius:6px;padding:1px 4px;margin-top:4px}
